# ============================================================
# ULPF - Air-Gapped Deployment
# Reference deployment for offline/air-gapped environments.
# All images use pinned tags; no external network access required at runtime.
# ============================================================
# BUILD PROCESS (run on internet-connected machine):
#   docker compose -f docker-compose.airgap.yml build
#   docker save -o ulpf-images.tar $(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "ulpf|cp-zookeeper|cp-kafka|minio|opensearch|postgres")
#   # Transfer ulpf-images.tar to air-gapped machine
#   docker load -i ulpf-images.tar
#   docker compose -f docker-compose.airgap.yml up -d
# ============================================================
name: ulpf-airgap

services:
  # ---------- Messaging backbone ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: ulpf_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ulpf-internal
    # No ports exposed externally in air-gapped mode

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ulpf_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - ulpf-internal

  # ---------- Raw vault (lossless storage) ----
  minio:
    image: minio/minio:RELEASE.2024-06-07T00-10-36Z
    container_name: ulpf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 6
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    depends_on:
      - kafka
    networks:
      - ulpf-internal

  # ---------- Normalized, searchable store ----
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: ulpf_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
    ports:
      - "9200:9200"
    volumes:
      - os_data:/usr/share/opensearch/data
    networks:
      - ulpf-internal

  # ---------- Metadata / RBAC / registry ----
  postgres:
    image: postgres:16-alpine
    container_name: ulpf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >-
      postgres -c log-statement=mod
               -c max_connections=200
    networks:
      - ulpf-internal

  # ---------- ULPF Backend API ----
  ulpf-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ulpf-api:local
    container_name: ulpf_api
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      ULPF_ENV: production
      ULPF_APP_HOST: 0.0.0.0
      ULPF_APP_PORT: 5000
      ULPF_LOG_LEVEL: INFO
      ULPF_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OPENSEARCH_HOST: opensearch:9200
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ULPF_AUTH_ENABLED: "true"
    networks:
      - ulpf-internal

  # ---------- ULPF Pipeline Runner ----
  ulpf-pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ulpf-pipeline:local
    container_name: ulpf_pipeline
    restart: unless-stopped
    depends_on:
      ulpf-api:
        condition: service_started
    environment:
      ULPF_ENV: production
      ULPF_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OPENSEARCH_HOST: opensearch:9200
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - ulpf-internal
    command: python -m ulpf.orchestrator

  # ---------- ULPF Simulators ----
  ulpf-simulators:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ulpf-simulators:local
    container_name: ulpf_simulators
    restart: unless-stopped
    depends_on:
      ulpf-api:
        condition: service_started
    environment:
      ULPF_ENV: production
      REST_INGEST_PORT: 5000
      # Simulators target the internal API service
    networks:
      - ulpf-internal
    command: python -m ulpf.simulators.runner

  # ---------- ULPF Frontend ----
  ulpf-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ulpf-frontend:local
    container_name: ulpf_frontend
    restart: unless-stopped
    depends_on:
      - ulpf-api
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    networks:
      - ulpf-internal
      - ulpf-external

networks:
  ulpf-internal:
    driver: bridge
    internal: true  # No outbound internet access from this network
  ulpf-external:
    driver: bridge
    internal: false  # Only frontend needs external access for browser

volumes:
  minio_data:
  os_data:
  postgres_data: